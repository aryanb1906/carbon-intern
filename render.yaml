services:
  - type: web
    name: carbontrace-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: carbontrace-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: carbontrace-redis
          type: redis
          property: connectionString

  - type: worker
    name: carbontrace-worker
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carbontrace-db
          property: connectionString

  - type: redis
    name: carbontrace-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: carbontrace-db
    plan: free
    databaseName: carbontrace
    user: carbontrace
